<!doctype html>
<!--
  Trial editor: Decap CMS with DecapBridge email login.
  Collections and the live preview are shared with /admin-sveltia in
  /cms/shared.js. Only the login differs.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>MPCBC Editor (Decap trial)</title>
    <link rel="icon" href="/images/logo.png" />
    <script>window.CMS_MANUAL_INIT = true;</script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>
    <script src="/cms/shared.js"></script>
    <script>
      MPCBC_CMS.start(window.CMS, {
        // From the DecapBridge dashboard after adding the site there.
        // Replace SITE_ID with the id it shows (see DEVELOPMENT.md).
        name: 'git-gateway',
        repo: 'ChrisLKH/mpcbc',
        // A trial branch, so saves here never reach the live site.
        // Change to 'main' only once this editor is the real one.
        branch: 'cms-trial',
        identity_url: 'https://auth.decapbridge.com/sites/SITE_ID',
        gateway_url: 'https://gateway.decapbridge.com',
        squash_merges: true,
      });
    </script>
  </body>
</html>
