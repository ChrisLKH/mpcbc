<!doctype html>
<!--
  Trial editor: Decap CMS with DecapBridge email login.
  Collections and the live preview are shared with /admin-sveltia in
  /cms/shared.js. Only the login differs.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>MPCBC Editor (Decap trial)</title>
    <link rel="icon" href="/images/logo.png" />
    <script>window.CMS_MANUAL_INIT = true;</script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.6.0/dist/decap-cms.js"></script>
    <script src="/cms/shared.js"></script>
    <script>
      // From the DecapBridge dashboard. The site id is not a secret — it
      // only names this site to DecapBridge, which still asks each editor
      // to sign in.
      const SITE = '/sites/8fcff31f-fdcf-4482-a422-ca8d9397fa0e';

      // Commits carry the editor's name but deliberately not their email:
      // the repo is public, so anything in a commit message is too.
      const by = ' - {{author-name}} via DecapBridge';

      MPCBC_CMS.start(window.CMS, {
        name: 'git-gateway',
        repo: 'ChrisLKH/mpcbc',
        // Saves go to main, which deploys the live site.
        branch: 'main',
        auth_type: 'pkce',
        base_url: 'https://auth.decapbridge.com',
        auth_endpoint: SITE + '/pkce',
        auth_token_endpoint: SITE + '/token',
        gateway_url: 'https://gateway.decapbridge.com',
        commit_messages: {
          create: 'Create {{collection}} “{{slug}}”' + by,
          update: 'Update {{collection}} “{{slug}}”' + by,
          delete: 'Delete {{collection}} “{{slug}}”' + by,
          uploadMedia: 'Upload “{{path}}”' + by,
          deleteMedia: 'Delete “{{path}}”' + by,
          openAuthoring: 'Message {{message}}' + by,
        },
      }, {
        auth: {
          email_claim: 'email',
          first_name_claim: 'first_name',
          last_name_claim: 'last_name',
          avatar_url_claim: 'avatar_url',
        },
      });
    </script>
  </body>
</html>
