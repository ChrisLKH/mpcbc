<!doctype html>
<!--
  Trial editor: Sveltia CMS with GitHub login.
  Collections and the live preview are shared with /admin-decap in
  /cms/shared.js. Only the login differs.

  Signing in needs a GitHub account with access to the repo. Choose
  "Sign in with token" and paste a fine-grained personal access token
  (Contents: read and write on this repo). Email login arrives with
  Sveltia 1.0; until then this page is for trying the editor itself.
  On localhost, "Work with local repository" edits the files directly.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>MPCBC Editor (Sveltia trial)</title>
    <link rel="icon" href="/images/logo.png" />
    <script>window.CMS_MANUAL_INIT = true;</script>
  </head>
  <body>
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
    <script src="/cms/shared.js"></script>
    <script>
      MPCBC_CMS.start(window.CMS, {
        name: 'github',
        repo: 'ChrisLKH/mpcbc',
        // A trial branch, so saves here never reach the live site.
        branch: 'cms-trial',
      });
    </script>
  </body>
</html>
