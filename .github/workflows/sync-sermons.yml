name: Sync sermon archive

# Once a day is plenty — new sermons only appear weekly.
# The livestream status is a separate, faster job on Cloudflare.
on:
  schedule:
    - cron: '0 11 * * *'   # 3am Pacific
  workflow_dispatch:        # lets anyone run it by hand from the Actions tab

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pull new sermons from YouTube
        id: sync
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          PLAYLIST_CANTONESE: ${{ vars.PLAYLIST_CANTONESE }}
          PLAYLIST_MANDARIN: ${{ vars.PLAYLIST_MANDARIN }}
          PLAYLIST_ENGLISH: ${{ vars.PLAYLIST_ENGLISH }}
        run: node scripts/sync-sermons.mjs

      - name: Commit new sermons
        run: |
          if [ -n "$(git status --porcelain src/content/sermons)" ]; then
            git config user.name  "MPCBC sermon sync"
            git config user.email "actions@github.com"
            git add src/content/sermons
            git commit -m "Add new sermons from YouTube"
            git push
          else
            echo "Nothing new."
          fi
